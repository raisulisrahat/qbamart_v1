map $http_user_agent $is_crawler {
    default         0;
    ~*facebookexternalhit 1;
    ~*twitterbot    1;
    ~*whatsapp      1;
    ~*telegrambot   1;
    ~*discordbot    1;
    ~*googlebot     1;
    ~*bingbot       1;
    ~*Slackbot      1;
    ~*LinkedInBot   1;
}

server {
    listen 80;
    server_name localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "MSIE [1-6]\.";

    # SEO Proxy: serve Django-rendered HTML for all social crawlers
    location @seo_proxy {
        proxy_pass http://backend:8000;
    }

    # Do not cache index.html to ensure clients always get the latest version
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Cache Vite fingerprinted build assets (fingerprinted files are safe to cache forever)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Frontend
    location / {
        # Route crawlers to Django SEO proxy (serves pre-rendered OG HTML)
        if ($is_crawler) {
            rewrite ^/(.*)$ /api/seo-proxy/?path=/$1 last;
        }

        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API and Admin Proxy
    location ~ ^/(api|admin|staff) {
        proxy_pass http://backend:8000;
    }

    # Django Media
    location /media/ {
        alias /app/backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Django Static
    location /django_static/ {
        alias /app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
