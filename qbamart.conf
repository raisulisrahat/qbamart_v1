server {
    listen 80;
    server_name dev.qbamart.com;

    # Frontend - Vite Build Files
    root /var/www/qbamart/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html to ensure clients always get the latest version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Cache Vite fingerprinted build assets (fingerprinted files are safe to cache forever)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Backend API & Admin
    location ~ ^/(api|admin) {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/gunicorn.sock;
    }

    # Django Static Files
    location /static/backend/ {
        alias /var/www/qbamart/backend/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Django Media Files
    location /media/ {
        alias /var/www/qbamart/backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}

